<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">WarrantyVault</h1>
    <h2 class="auth-subtitle">Connexion</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="vous@exemple.com"
          autocomplete="email"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="error-text">Email invalide</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Minimum 8 caractères"
          autocomplete="current-password"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="error-text">Mot de passe requis (min. 8 caractères)</span>
        }
      </div>

      @if (error()) {
        <p class="alert-error">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="auth-link">
      Pas encore de compte ?
      <a routerLink="/auth/register">S'inscrire</a>
    </p>
  </div>
</div>
